[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 自动发现 backend 下的包，新增业务域无需改构建配置
where = ["backend"]
include = ["app*"]

[project]
name = "ai-assistant"
version = "0.1.0"
description = "AI assistant backend demonstrating the project engineering standard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["backend"]
# 规范文档与虚拟环境不属于 lint 范围
extend-exclude = [".venv", ".workbuddy", "**/*.md", "scripts/md_to_speech.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ANN", "D", "S"]
# D100 / D104: the banner carries the module description, packages included
# D200: our docstrings always keep the opening delimiter on its own line
# D203 / D212: the summary starts on the second line by design
# ANN401: Any usage is reviewed by check_style.py instead
ignore = ["D100", "D104", "D200", "D203", "D212", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
