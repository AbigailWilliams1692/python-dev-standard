[build-system]
# 77 起支持 PEP 639 的 license 表达式，无需再用 license = { text = "MIT" } 的老写法
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mylib"
dynamic = ["version"]
description = "Replace this line with one sentence describing the problem the library solves"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["replace", "these", "keywords"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# 库的默认依赖应尽量为空：每多一个依赖，下游的冲突面就大一圈
dependencies = []

[project.optional-dependencies]
# 按功能分组，不要把所有东西塞进一个 dev 组
cli = ["typer>=0.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-account/mylib"
Issues = "https://github.com/your-account/mylib/issues"
Changelog = "https://github.com/your-account/mylib/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# src layout：仓库根不放包，避免 cwd 遮蔽已安装版本导致的假绿
where = ["src"]
include = ["mylib*"]

[tool.setuptools.package-data]
# 没有 py.typed，mypy 会忽略本库所有类型标注（PEP 561）
mylib = ["py.typed"]

[tool.setuptools.dynamic]
# 版本只在 _version.py 里写一次，构建时读取，杜绝两处漂移
version = { attr = "mylib._version.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "**/*.md", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ANN", "D", "S"]
# D100 / D104: banner 承担模块说明职责，包文件也不例外
# D200: docstring 首行只写三引号是刻意约定
# D203 / D212: 摘要从第二行开始
# ANN401: Any 的使用由 check_style.py 复核
ignore = ["D100", "D104", "D200", "D203", "D212", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src"]
# 未标注的第三方库一律报错，逼自己装 stub 或者写 ignore
warn_unused_ignores = true

[tool.pytest.ini_options]
# 靠 pythonpath 而不是 pip install -e，CI 少一步安装也能暴露 import 错误
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
