name: CI

# 库型项目的门禁与服务工作区不同：
#   1. 必须跑多版本矩阵 —— 库活在别人的环境里，只测一个版本等于没测
#   2. 必须验证构建产物 —— 装不上就等于没发布
#   3. 没有分层校验 —— 库没有四层结构，强行检查只会制造假规则

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限对齐 pyproject 的 requires-python，其余取当前稳定版
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gate 1 - project style
        # 规范器由技能提供，不在本仓库内；独立 clone 时跳过而不是中断
        run: |
          STYLE_SCRIPT=""
          for candidate in scripts/check_style.py \
              .workbuddy/skills/python-dev-standard/scripts/check_style.py; do
            if [ -f "$candidate" ]; then
              STYLE_SCRIPT="$candidate"
              break
            fi
          done
          if [ -n "$STYLE_SCRIPT" ]; then
            python "$STYLE_SCRIPT" src tests
          else
            echo "::warning::check_style.py 未找到，风格门已跳过（规范内容仍适用）"
          fi

      - name: Gate 2 - format and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Gate 3 - types
        run: mypy

      - name: Gate 4 - tests
        run: pytest -q

  package:
    name: package / build and metadata
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Assert py.typed ships in the wheel
        # 少了这个文件，下游 mypy 会静默忽略本库所有类型标注（PEP 561）
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          if "mylib/py.typed" not in names:
              print("::error::py.typed missing from wheel")
              sys.exit(1)
          print("py.typed present:", wheel.name)
          PY

      - name: Smoke test the installed wheel
        # 从 dist 安装而不是从 src，暴露 "本地能 import、装完 import 不到"
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import mylib
          from mylib import Version
          assert mylib.__version__, 'version missing'
          assert Version.parse('1.2.3').as_tuple == (1, 2, 3)
          print('wheel smoke test passed', mylib.__version__)
          "
