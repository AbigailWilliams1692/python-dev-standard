# 提交前门禁：与 CI 同一套规则，但反馈快得多
# 安装：pip install pre-commit && pre-commit install
# 全量跑：pre-commit run --all-files

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 版本与 pyproject 中 ruff 的下限保持同代，升级时两处一起改
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # 行尾空白与文件末尾换行是最常见的无意义 diff 来源
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # 防止把密钥扫进仓库的粗放兜底，真正的密钥管理在 03 号规范
      - id: detect-private-key

# 风格门（banner / 分区 / reST docstring）由技能提供的 check_style.py 负责。
# 它不在本仓库内，路径因项目而异，故不写进 pre-commit 配置，
# 而在 CI 里按「存在则跑」的方式处理，避免独立 clone 时整条配置失效。
#
# 想本地也跑：
#   cp <skill>/scripts/check_style.py scripts/check_style.py
#   python scripts/check_style.py src tests
